<!DOCTYPE html>

    <title>Input Amaliy</title>

</head>
<body>
       <div class="boxs" style="width: 1000px; height: 900px; background-color: rgb(195, 222, 213); margin: 0 auto;">

          <input class="input" type="text" required placeholder="Name .....">

       </div>
